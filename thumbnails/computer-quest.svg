<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="cqBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128" />
      <stop offset="45%" stop-color="#0d1b3e" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2b48" />
      <stop offset="100%" stop-color="#061526" />
    </linearGradient>

    <linearGradient id="towerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="70%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="amberAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <radialGradient id="neonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#cqBgGrad)" />

  <!-- Subtle Perspective Desk Surface & Grid -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="0" y1="260" x2="640" y2="260" />
    <line x1="60" y1="360" x2="180" y2="260" />
    <line x1="180" y1="360" x2="260" y2="260" />
    <line x1="320" y1="360" x2="340" y2="260" />
    <line x1="460" y1="360" x2="420" y2="260" />
    <line x1="580" y1="360" x2="500" y2="260" />
  </g>

  <!-- Ambient Backdrop Glow behind Monitor -->
  <circle cx="280" cy="150" r="140" fill="url(#neonGlow)" />

  <!-- DESKTOP SETUP COMPONENT GROUP -->
  <g id="computerSetup">
    <!-- 1. SYSTEM UNIT (TOWER) - Right Side -->
    <g id="tower" transform="translate(430, 90)">
      <!-- Shadow -->
      <ellipse cx="45" cy="180" rx="45" ry="10" fill="#000" opacity="0.4" />
      <!-- Main Case Body -->
      <rect x="0" y="0" width="85" height="175" rx="6" fill="url(#towerGrad)" stroke="#475569" stroke-width="2" />
      <!-- Front Bezel -->
      <rect x="6" y="8" width="73" height="158" rx="4" fill="#0f172a" />
      <!-- Power Button with LED -->
      <circle cx="42" cy="24" r="6" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" />
      <circle cx="42" cy="24" r="2.5" fill="#06b6d4" filter="url(#softGlow)" />
      <!-- USB Ports Panel -->
      <rect x="25" y="38" width="12" height="4" rx="1" fill="#38bdf8" />
      <rect x="48" y="38" width="12" height="4" rx="1" fill="#38bdf8" />
      <!-- Audio Jack -->
      <circle cx="36" cy="48" r="2" fill="#22c55e" />
      <circle cx="49" cy="48" r="2" fill="#ef4444" />
      <!-- Drive Bay Slots -->
      <rect x="18" y="58" width="49" height="7" rx="2" fill="#1e293b" />
      <rect x="18" y="70" width="49" height="7" rx="2" fill="#1e293b" />
      <!-- Front RGB Fans / Cooling Mesh with Glow -->
      <rect x="16" y="88" width="53" height="70" rx="4" fill="#020617" stroke="#334155" stroke-width="1" />
      <circle cx="42" cy="106" r="14" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4,2" />
      <circle cx="42" cy="140" r="14" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4,2" />
      <!-- Label Tag -->
      <rect x="10" y="166" width="65" height="14" rx="3" fill="#0369a1" />
      <text x="42" y="176" fill="#f8fafc" font-size="8" font-family="sans-serif" font-weight="bold" text-anchor="middle">UNITÉ CENTRALE</text>
    </g>

    <!-- 2. MONITOR (SCREEN) - Center -->
    <g id="monitor" transform="translate(170, 70)">
      <!-- Monitor Stand -->
      <path d="M 90 150 L 130 150 L 135 185 L 85 185 Z" fill="#334155" stroke="#1e293b" stroke-width="1.5" />
      <ellipse cx="110" cy="186" rx="48" ry="8" fill="#1e293b" stroke="#475569" stroke-width="2" />
      <!-- Display Outer Bezel -->
      <rect x="0" y="0" width="220" height="150" rx="8" fill="#0f172a" stroke="#475569" stroke-width="2.5" />
      <!-- Active Screen Display -->
      <rect x="8" y="8" width="204" height="128" rx="4" fill="url(#screenGrad)" stroke="#0284c7" stroke-width="1" />
      <!-- Code / Learning Visuals on Screen -->
      <rect x="18" y="20" width="70" height="8" rx="2" fill="#38bdf8" opacity="0.9" />
      <rect x="18" y="34" width="120" height="5" rx="1.5" fill="#94a3b8" opacity="0.6" />
      <rect x="18" y="44" width="95" height="5" rx="1.5" fill="#94a3b8" opacity="0.6" />
      <rect x="18" y="54" width="140" height="5" rx="1.5" fill="#94a3b8" opacity="0.6" />
      <!-- Mini Hardware Diagram on Screen -->
      <rect x="135" y="72" width="65" height="52" rx="4" fill="#0b1b2d" stroke="#38bdf8" stroke-width="1" />
      <circle cx="167" cy="94" r="12" fill="none" stroke="#22c55e" stroke-width="1.5" />
      <text x="167" y="118" fill="#38bdf8" font-size="7" font-family="sans-serif" font-weight="bold" text-anchor="middle">READY</text>
      <!-- Webcam mounted on top -->
      <rect x="96" y="-7" width="28" height="9" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <circle cx="110" cy="-2" r="3.5" fill="#0284c7" filter="url(#softGlow)" />
      <circle cx="110" cy="-2" r="1.5" fill="#ffffff" />
      <!-- Monitor Label Tag -->
      <rect x="75" y="140" width="70" height="14" rx="3" fill="#0284c7" />
      <text x="110" y="150" fill="#f8fafc" font-size="8" font-family="sans-serif" font-weight="bold" text-anchor="middle">ÉCRAN</text>
    </g>

    <!-- 3. SPEAKERS - Flanking Monitor -->
    <!-- Left Speaker -->
    <g id="speakerLeft" transform="translate(115, 130)">
      <rect x="0" y="0" width="36" height="85" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
      <circle cx="18" cy="28" r="10" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" />
      <circle cx="18" cy="60" r="13" fill="#0f172a" stroke="#06b6d4" stroke-width="2" />
      <circle cx="18" cy="60" r="4" fill="#06b6d4" />
    </g>
    <!-- Right Speaker -->
    <g id="speakerRight" transform="translate(405, 155)">
      <rect x="0" y="0" width="22" height="60" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
      <circle cx="11" cy="20" r="7" fill="#0f172a" stroke="#06b6d4" stroke-width="1" />
      <circle cx="11" cy="42" r="9" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" />
    </g>

    <!-- 4. KEYBOARD - Foreground Center -->
    <g id="keyboard" transform="translate(180, 260)">
      <!-- Keyboard Base -->
      <polygon points="0,32 18,0 182,0 200,32" fill="#1e293b" stroke="#475569" stroke-width="2" />
      <!-- Key Rows -->
      <g fill="#334155" stroke="#0f172a" stroke-width="0.8">
        <!-- Row 1 -->
        <rect x="22" y="3" width="11" height="5" rx="1" />
        <rect x="35" y="3" width="11" height="5" rx="1" />
        <rect x="48" y="3" width="11" height="5" rx="1" />
        <rect x="61" y="3" width="11" height="5" rx="1" />
        <rect x="74" y="3" width="11" height="5" rx="1" />
        <rect x="87" y="3" width="11" height="5" rx="1" />
        <rect x="100" y="3" width="11" height="5" rx="1" />
        <rect x="113" y="3" width="11" height="5" rx="1" />
        <rect x="126" y="3" width="11" height="5" rx="1" />
        <rect x="139" y="3" width="11" height="5" rx="1" />
        <rect x="152" y="3" width="18" height="5" rx="1" fill="#0284c7" />
        <!-- Row 2 -->
        <rect x="18" y="10" width="14" height="5" rx="1" />
        <rect x="34" y="10" width="11" height="5" rx="1" />
        <rect x="47" y="10" width="11" height="5" rx="1" />
        <rect x="60" y="10" width="11" height="5" rx="1" />
        <rect x="73" y="10" width="11" height="5" rx="1" />
        <rect x="86" y="10" width="11" height="5" rx="1" />
        <rect x="99" y="10" width="11" height="5" rx="1" />
        <rect x="112" y="10" width="11" height="5" rx="1" />
        <rect x="125" y="10" width="11" height="5" rx="1" />
        <rect x="138" y="10" width="11" height="5" rx="1" />
        <rect x="151" y="10" width="22" height="5" rx="1" />
        <!-- Row 3 & Spacebar -->
        <rect x="14" y="17" width="18" height="6" rx="1" />
        <rect x="34" y="17" width="12" height="6" rx="1" />
        <rect x="48" y="17" width="12" height="6" rx="1" />
        <rect x="62" y="17" width="68" height="6" rx="1" fill="#38bdf8" opacity="0.9" />
        <rect x="132" y="17" width="12" height="6" rx="1" />
        <rect x="146" y="17" width="28" height="6" rx="1" fill="#0284c7" />
      </g>
      <!-- Keyboard Label Tag -->
      <rect x="68" y="35" width="64" height="13" rx="3" fill="#334155" />
      <text x="100" y="44" fill="#f8fafc" font-size="7.5" font-family="sans-serif" font-weight="bold" text-anchor="middle">CLAVIER</text>
    </g>

    <!-- 5. MOUSE - Foreground Right -->
    <g id="mouse" transform="translate(398, 266)">
      <ellipse cx="16" cy="18" rx="14" ry="20" fill="#1e293b" stroke="#475569" stroke-width="2" />
      <!-- Click Divider & Scroll Wheel -->
      <line x1="16" y1="2" x2="16" y2="15" stroke="#475569" stroke-width="1.5" />
      <rect x="14" y="6" width="4" height="8" rx="2" fill="#06b6d4" />
      <!-- Mouse Accent Glow -->
      <path d="M 6 22 Q 16 34 26 22" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.8" />
      <!-- Mouse Label Tag -->
      <rect x="-2" y="42" width="36" height="12" rx="3" fill="#334155" />
      <text x="16" y="50" fill="#f8fafc" font-size="7" font-family="sans-serif" font-weight="bold" text-anchor="middle">SOURIS</text>
    </g>

    <!-- 6. PRINTER - Left Background Desk -->
    <g id="printer" transform="translate(25, 175)">
      <rect x="0" y="18" width="75" height="42" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
      <!-- Paper Tray Top -->
      <rect x="12" y="2" width="50" height="18" rx="2" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1" />
      <!-- Output Slot & Printed Sheet -->
      <rect x="14" y="32" width="48" height="4" rx="1" fill="#0f172a" />
      <rect x="18" y="36" width="40" height="20" rx="1" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" />
      <line x1="22" y1="42" x2="48" y2="42" stroke="#64748b" stroke-width="1" />
      <line x1="22" y1="47" x2="52" y2="47" stroke="#64748b" stroke-width="1" />
      <!-- Status Lights -->
      <circle cx="64" cy="24" r="2" fill="#22c55e" />
      <!-- Printer Label Tag -->
      <rect x="5" y="62" width="65" height="13" rx="3" fill="#334155" />
      <text x="37" y="71" fill="#f8fafc" font-size="7.5" font-family="sans-serif" font-weight="bold" text-anchor="middle">IMPRIMANTE</text>
    </g>

    <!-- 7. USB FLASH DRIVE & PORTS DETAIL - Foreground Accent -->
    <g id="usbPort" transform="translate(530, 220)">
      <rect x="0" y="0" width="38" height="18" rx="3" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" />
      <rect x="26" y="4" width="14" height="10" rx="1" fill="#94a3b8" />
      <rect x="30" y="6" width="3" height="2" fill="#0284c7" />
      <rect x="30" y="10" width="3" height="2" fill="#0284c7" />
      <circle cx="10" cy="9" r="3" fill="#38bdf8" filter="url(#softGlow)" />
      <!-- Label Tag -->
      <rect x="-4" y="22" width="54" height="13" rx="3" fill="#0369a1" />
      <text x="23" y="31" fill="#f8fafc" font-size="7.5" font-family="sans-serif" font-weight="bold" text-anchor="middle">PORT USB</text>
    </g>
  </g>

  <!-- TOP TITLE BANNER -->
  <g id="titleBanner" transform="translate(320, 36)">
    <rect x="-190" y="-20" width="380" height="40" rx="20" fill="#0b1730" fill-opacity="0.9" stroke="#0284c7" stroke-width="1.5" />
    <text x="0" y="-1" fill="#38bdf8" font-size="16" font-family="sans-serif" font-weight="900" letter-spacing="1.5" text-anchor="middle">COMPUTER QUEST</text>
    <text x="0" y="13" fill="#94a3b8" font-size="10" font-family="sans-serif" font-weight="600" text-anchor="middle">DÉCOUVRIR L'ORDINATEUR • 5 DÉFIS</text>
  </g>
</svg>
