<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#bgGrad)" />

  <!-- Grid lines -->
  <g stroke="#334155" stroke-width="1" stroke-dasharray="4,4" opacity="0.3">
    <line x1="80" y1="0" x2="80" y2="360" />
    <line x1="160" y1="0" x2="160" y2="360" />
    <line x1="240" y1="0" x2="240" y2="360" />
    <line x1="320" y1="0" x2="320" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
    <line x1="560" y1="0" x2="560" y2="360" />
    <line x1="0" y1="60" x2="640" y2="60" />
    <line x1="0" y1="120" x2="640" y2="120" />
    <line x1="0" y1="180" x2="640" y2="180" />
    <line x1="0" y1="240" x2="640" y2="240" />
    <line x1="0" y1="300" x2="640" y2="300" />
  </g>

  <!-- Radial Glow Behind Selection -->
  <circle cx="320" cy="180" r="160" fill="url(#cyanGlow)" />

  <!-- Simulated Window with Resizing Handles -->
  <rect x="180" y="70" width="300" height="200" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1.5" />
  <!-- Window Header -->
  <rect x="180" y="70" width="300" height="28" rx="8" fill="#0f172a" />
  <circle cx="196" cy="84" r="4" fill="#ef4444" />
  <circle cx="208" cy="84" r="4" fill="#f59e0b" />
  <circle cx="220" cy="84" r="4" fill="#10b981" />
  <text x="330" y="88" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="600">640 × 480 px</text>

  <!-- Selection Lasso (Dashed Marquee Box) -->
  <rect x="230" y="115" width="180" height="125" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,4" />

  <!-- Selected file icons inside marquee -->
  <g transform="translate(250, 130)">
    <rect width="40" height="48" rx="4" fill="#3b82f6" fill-opacity="0.3" stroke="#60a5fa" stroke-width="1.5" />
    <text x="20" y="32" font-size="20" text-anchor="middle">📄</text>
  </g>
  <g transform="translate(310, 130)">
    <rect width="40" height="48" rx="4" fill="#3b82f6" fill-opacity="0.3" stroke="#60a5fa" stroke-width="1.5" />
    <text x="20" y="32" font-size="20" text-anchor="middle">📑</text>
  </g>
  <g transform="translate(250, 185)">
    <rect width="40" height="40" rx="4" fill="#3b82f6" fill-opacity="0.3" stroke="#60a5fa" stroke-width="1.5" />
    <text x="20" y="27" font-size="18" text-anchor="middle">📁</text>
  </g>
  <g transform="translate(310, 185)">
    <rect width="40" height="40" rx="4" fill="#3b82f6" fill-opacity="0.3" stroke="#60a5fa" stroke-width="1.5" />
    <text x="20" y="27" font-size="18" text-anchor="middle">🖼️</text>
  </g>

  <!-- Resize handles on window corners -->
  <rect x="474" y="264" width="8" height="8" rx="2" fill="#38bdf8" filter="url(#glow)" />
  <rect x="474" y="66" width="8" height="8" rx="2" fill="#94a3b8" />
  <rect x="176" y="264" width="8" height="8" rx="2" fill="#94a3b8" />

  <!-- Sleek Mouse Pointer Cursor -->
  <g transform="translate(390, 220)" filter="url(#glow)">
    <path d="M 0 0 L 12 32 L 18 22 L 28 28 L 32 20 L 22 14 L 32 6 Z" fill="#ffffff" stroke="#0f172a" stroke-width="2" />
  </g>

  <!-- Badge II -->
  <g transform="translate(540, 45)">
    <rect x="-25" y="-16" width="50" height="32" rx="8" fill="url(#cyanBlue)" />
    <text x="0" y="6" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="900" text-anchor="middle">II</text>
  </g>

  <!-- Title & Subtitle at bottom -->
  <text x="320" y="318" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="800" text-anchor="middle" letter-spacing="1">MOUSE MASTER II</text>
  <text x="320" y="340" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="2">PRÉCISION &amp; SÉLECTION</text>
</svg>
