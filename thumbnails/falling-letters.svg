<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#121829"/>
      <stop offset="100%" stop-color="#1a1435"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="keycap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a334a"/>
      <stop offset="100%" stop-color="#151b2a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Matrix/Cyber Grid -->
  <g stroke="rgba(56, 189, 248, 0.07)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
  </g>

  <!-- Speed trails -->
  <line x1="220" y1="40" x2="220" y2="160" stroke="#38bdf8" stroke-width="3" stroke-dasharray="12,12" opacity="0.6"/>
  <line x1="380" y1="20" x2="380" y2="210" stroke="#a855f7" stroke-width="4" stroke-dasharray="16,10" opacity="0.7"/>
  <line x1="560" y1="70" x2="560" y2="180" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8,8" opacity="0.5"/>

  <!-- Falling letter boxes -->
  <g transform="translate(180, 150) rotate(-8)">
    <rect width="70" height="70" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="3" filter="url(#glow)"/>
    <text x="35" y="48" fill="#ffffff" font-family="'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="34" text-anchor="middle">A</text>
  </g>

  <g transform="translate(340, 200) rotate(6)">
    <rect width="84" height="84" rx="16" fill="#2e1065" stroke="#c084fc" stroke-width="4" filter="url(#glow)"/>
    <text x="42" y="58" fill="#f5d0fe" font-family="'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="44" text-anchor="middle">T</text>
  </g>

  <g transform="translate(520, 170) rotate(12)">
    <rect width="72" height="72" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="3" filter="url(#glow)"/>
    <text x="36" y="50" fill="#ffffff" font-family="'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="36" text-anchor="middle">K</text>
  </g>

  <!-- Keycap target dock at bottom -->
  <g transform="translate(120, 340)">
    <rect width="110" height="60" rx="10" fill="url(#keycap)" stroke="#334155" stroke-width="2"/>
    <text x="55" y="38" fill="#94a3b8" font-family="sans-serif" font-weight="700" font-size="20" text-anchor="middle">Q</text>

    <rect x="140" width="110" height="60" rx="10" fill="url(#keycap)" stroke="#38bdf8" stroke-width="3" filter="url(#glow)"/>
    <text x="195" y="38" fill="#38bdf8" font-family="sans-serif" font-weight="800" font-size="22" text-anchor="middle">SPACE</text>

    <rect x="280" width="110" height="60" rx="10" fill="url(#keycap)" stroke="#334155" stroke-width="2"/>
    <text x="335" y="38" fill="#94a3b8" font-family="sans-serif" font-weight="700" font-size="20" text-anchor="middle">E</text>

    <rect x="420" width="110" height="60" rx="10" fill="url(#keycap)" stroke="#334155" stroke-width="2"/>
    <text x="475" y="38" fill="#94a3b8" font-family="sans-serif" font-weight="700" font-size="20" text-anchor="middle">R</text>
  </g>

  <!-- Game title brand -->
  <text x="400" y="75" fill="url(#accent)" font-family="'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="38" text-anchor="middle" letter-spacing="4">FALLING LETTER</text>
  <text x="400" y="105" fill="#94a3b8" font-family="'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="14" text-anchor="middle" letter-spacing="2">KEYBOARD REFLEX &amp; TYPING SPEED</text>
</svg>