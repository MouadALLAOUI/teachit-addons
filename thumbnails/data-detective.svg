<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.12)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.03)" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#bgGrad)" />

  <!-- Cyber Grid Pattern -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="60" x2="640" y2="60" />
    <line x1="0" y1="120" x2="640" y2="120" />
    <line x1="0" y1="180" x2="640" y2="180" />
    <line x1="0" y1="240" x2="640" y2="240" />
    <line x1="0" y1="300" x2="640" y2="300" />
    <line x1="80" y1="0" x2="80" y2="360" />
    <line x1="160" y1="0" x2="160" y2="360" />
    <line x1="240" y1="0" x2="240" y2="360" />
    <line x1="320" y1="0" x2="320" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
    <line x1="560" y1="0" x2="560" y2="360" />
  </g>

  <!-- Glowing Pipeline Track -->
  <path d="M 70 170 L 570 170" stroke="url(#accentGrad)" stroke-width="4" stroke-dasharray="8 6" opacity="0.8" />

  <!-- Station Nodes (5 Stations: Collecter, Stocker, Traiter, Diffuser, Utiliser) -->
  <!-- 1. Collecter -->
  <g transform="translate(100, 170)">
    <circle r="34" fill="#1e1b4b" stroke="#6366f1" stroke-width="3" filter="url(#glow)" />
    <circle r="26" fill="rgba(99, 102, 241, 0.25)" />
    <text text-anchor="middle" y="9" font-size="24">📥</text>
    <text text-anchor="middle" y="52" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="11" font-weight="700">COLLECTER</text>
  </g>

  <!-- 2. Stocker -->
  <g transform="translate(210, 170)">
    <circle r="34" fill="#0f172a" stroke="#0ea5e9" stroke-width="3" filter="url(#glow)" />
    <circle r="26" fill="rgba(14, 165, 233, 0.25)" />
    <text text-anchor="middle" y="9" font-size="24">🗄️</text>
    <text text-anchor="middle" y="52" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">STOCKER</text>
  </g>

  <!-- 3. Traiter -->
  <g transform="translate(320, 170)">
    <circle r="38" fill="#111827" stroke="#f59e0b" stroke-width="3.5" filter="url(#glow)" />
    <circle r="30" fill="rgba(245, 158, 11, 0.25)" />
    <text text-anchor="middle" y="10" font-size="28">⚙️</text>
    <text text-anchor="middle" y="56" fill="#fde68a" font-family="system-ui, sans-serif" font-size="12" font-weight="800">TRAITER</text>
  </g>

  <!-- 4. Diffuser -->
  <g transform="translate(430, 170)">
    <circle r="34" fill="#0f172a" stroke="#06b6d4" stroke-width="3" filter="url(#glow)" />
    <circle r="26" fill="rgba(6, 182, 212, 0.25)" />
    <text text-anchor="middle" y="9" font-size="24">📊</text>
    <text text-anchor="middle" y="52" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="11" font-weight="700">DIFFUSER</text>
  </g>

  <!-- 5. Utiliser -->
  <g transform="translate(540, 170)">
    <circle r="34" fill="#064e3b" stroke="#10b981" stroke-width="3" filter="url(#glow)" />
    <circle r="26" fill="rgba(16, 185, 129, 0.25)" />
    <text text-anchor="middle" y="9" font-size="24">💡</text>
    <text text-anchor="middle" y="52" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11" font-weight="700">UTILISER</text>
  </g>

  <!-- Flow Arrows -->
  <polygon points="152,166 160,170 152,174" fill="#818cf8" />
  <polygon points="262,166 270,170 262,174" fill="#38bdf8" />
  <polygon points="372,166 380,170 372,174" fill="#fbbf24" />
  <polygon points="482,166 490,170 482,174" fill="#34d399" />

  <!-- Header Badge & Title -->
  <g transform="translate(40, 50)">
    <rect width="180" height="26" rx="13" fill="rgba(99, 102, 241, 0.25)" stroke="#6366f1" stroke-width="1.2" />
    <text x="14" y="17" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">🔍 TRAITEMENT DES DONNÉES</text>
  </g>

  <text x="40" y="105" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900" letter-spacing="0.5">Data Detective</text>
  <text x="40" y="128" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="500">Comprendre l'information : Données → Traitement → Décision</text>

  <!-- Bottom Badges -->
  <g transform="translate(40, 310)">
    <rect width="105" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="12" y="16" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">⏱️ 15–20 min</text>
  </g>
  <g transform="translate(155, 310)">
    <rect width="115" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="12" y="16" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">🟢 Niveau Débutant</text>
  </g>
  <g transform="translate(280, 310)">
    <rect width="100" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="12" y="16" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">🛡️ 100% Hors-ligne</text>
  </g>
</svg>
