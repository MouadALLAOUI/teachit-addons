<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="deBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Desktop Screen Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Window Gradient -->
    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Accent Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="640" height="360" fill="url(#deBgGrad)" />

  <!-- Background Ambient Glow -->
  <circle cx="320" cy="180" r="160" fill="#6366f1" opacity="0.15" filter="url(#purpleGlow)" />
  <circle cx="480" cy="120" r="100" fill="#06b6d4" opacity="0.12" filter="url(#cyanGlow)" />

  <!-- Grid lines -->
  <g stroke="#334155" stroke-width="1" opacity="0.3">
    <line x1="40" y1="0" x2="40" y2="360" />
    <line x1="120" y1="0" x2="120" y2="360" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="280" y1="0" x2="280" y2="360" />
    <line x1="360" y1="0" x2="360" y2="360" />
    <line x1="440" y1="0" x2="440" y2="360" />
    <line x1="520" y1="0" x2="520" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />

    <line x1="0" y1="60" x2="640" y2="60" />
    <line x1="0" y1="120" x2="640" y2="120" />
    <line x1="0" y1="180" x2="640" y2="180" />
    <line x1="0" y1="240" x2="640" y2="240" />
    <line x1="0" y1="300" x2="640" y2="300" />
  </g>

  <!-- Central Computer Monitor / Desktop Canvas -->
  <g transform="translate(80, 40)">
    <!-- Monitor Bezel -->
    <rect x="0" y="0" width="480" height="280" rx="14" fill="#090d16" stroke="#475569" stroke-width="2.5" />
    
    <!-- Screen Area -->
    <rect x="8" y="8" width="464" height="264" rx="8" fill="url(#screenGrad)" />

    <!-- Desktop Wallpaper Artwork inside Monitor -->
    <path d="M 8 200 Q 140 130 260 170 T 472 130 L 472 244 L 8 244 Z" fill="#312e81" opacity="0.5" />
    <path d="M 8 220 Q 180 160 320 200 T 472 170 L 472 244 L 8 244 Z" fill="#4338ca" opacity="0.4" />

    <!-- Desktop Icons (Left column) -->
    <!-- 1. Recycle Bin -->
    <g transform="translate(24, 24)">
      <rect x="0" y="0" width="44" height="44" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.9" />
      <text x="22" y="28" font-size="20" text-anchor="middle" dominant-baseline="middle">🗑️</text>
      <text x="22" y="55" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Corbeille</text>
    </g>

    <!-- 2. Text Editor App -->
    <g transform="translate(24, 94)">
      <rect x="0" y="0" width="44" height="44" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" opacity="0.9" />
      <text x="22" y="28" font-size="20" text-anchor="middle" dominant-baseline="middle">📝</text>
      <text x="22" y="55" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Éditeur</text>
    </g>

    <!-- 3. Folder Informatique -->
    <g transform="translate(24, 164)">
      <rect x="0" y="0" width="44" height="44" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5" opacity="0.9" />
      <text x="22" y="28" font-size="20" text-anchor="middle" dominant-baseline="middle">📁</text>
      <text x="22" y="55" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1" text-anchor="middle">Informatique</text>
    </g>

    <!-- Simulated Application Window (Text Editor) -->
    <g transform="translate(100, 28)">
      <!-- Window Shadow / Glow -->
      <rect x="0" y="0" width="340" height="190" rx="8" fill="#000000" opacity="0.4" />
      <!-- Window Container -->
      <rect x="0" y="0" width="340" height="190" rx="8" fill="url(#windowGrad)" stroke="#6366f1" stroke-width="2" />
      
      <!-- Title Bar -->
      <rect x="0" y="0" width="340" height="30" rx="8" fill="#1e1b4b" />
      <rect x="0" y="22" width="340" height="8" fill="#1e1b4b" />
      <line x1="0" y1="30" x2="340" y2="30" stroke="#4f46e5" stroke-width="1" />

      <!-- Title Bar Content -->
      <text x="12" y="20" font-size="13" dominant-baseline="middle">📝</text>
      <text x="32" y="19" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0" dominant-baseline="middle">
        Mon premier document.txt — Éditeur de texte
      </text>

      <!-- Window Control Buttons (Minimize, Maximize, Close) -->
      <g transform="translate(265, 7)">
        <!-- Minimize -->
        <rect x="0" y="0" width="18" height="16" rx="3" fill="#334155" />
        <line x1="4" y1="11" x2="14" y2="11" stroke="#cbd5e1" stroke-width="1.5" />

        <!-- Maximize -->
        <rect x="24" y="0" width="18" height="16" rx="3" fill="#334155" />
        <rect x="28" y="4" width="10" height="8" fill="none" stroke="#cbd5e1" stroke-width="1.5" />

        <!-- Close -->
        <rect x="48" y="0" width="18" height="16" rx="3" fill="#ef4444" opacity="0.9" />
        <line x1="53" y1="4" x2="61" y2="12" stroke="#ffffff" stroke-width="1.5" />
        <line x1="61" y1="4" x2="53" y2="12" stroke="#ffffff" stroke-width="1.5" />
      </g>

      <!-- Menu Bar -->
      <rect x="0" y="30" width="340" height="20" fill="#0f172a" />
      <text x="12" y="43" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Fichier</text>
      <text x="56" y="43" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Édition</text>
      <text x="100" y="43" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Affichage</text>
      <line x1="0" y1="50" x2="340" y2="50" stroke="#1e293b" stroke-width="1" />

      <!-- Document Content Body -->
      <rect x="10" y="60" width="320" height="116" rx="4" fill="#0b0f19" stroke="#1e293b" stroke-width="1" />
      <text x="22" y="84" font-family="monospace, monospace" font-size="12" fill="#38bdf8">
        Je découvre l'informatique.
      </text>
      <line x1="228" y1="73" x2="228" y2="87" stroke="#38bdf8" stroke-width="2" />
      
      <text x="22" y="112" font-family="monospace, monospace" font-size="11" fill="#64748b">
        Apprendre à organiser ses fichiers et dossiers.
      </text>
      <text x="22" y="132" font-family="monospace, monospace" font-size="11" fill="#475569">
        TeachIT — Bureau éducatif interactif
      </text>

      <!-- Document Status Bar -->
      <rect x="10" y="156" width="320" height="20" fill="#0f172a" />
      <text x="22" y="169" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">
        Ligne 1, Colonne 28 | Enregistré (UTF-8)
      </text>
    </g>

    <!-- Taskbar at bottom of monitor -->
    <g transform="translate(8, 240)">
      <rect x="0" y="0" width="464" height="32" rx="4" fill="#0b0f19" stroke="#1e293b" stroke-width="1" />
      
      <!-- Start Button (Menu Démarrer) -->
      <rect x="4" y="4" width="76" height="24" rx="4" fill="#4338ca" stroke="#6366f1" stroke-width="1" />
      <text x="14" y="19" font-size="12" dominant-baseline="middle">🪟</text>
      <text x="32" y="18" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" dominant-baseline="middle">
        Démarrer
      </text>

      <!-- Active Window Taskbar Pill -->
      <rect x="86" y="4" width="130" height="24" rx="4" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" />
      <text x="94" y="19" font-size="12" dominant-baseline="middle">📝</text>
      <text x="112" y="18" font-family="system-ui, sans-serif" font-size="9" fill="#e0e7ff" dominant-baseline="middle">
        Éditeur de texte
      </text>
      <line x1="88" y1="26" x2="214" y2="26" stroke="#6366f1" stroke-width="2" />

      <!-- Second App Pill (Explorer) -->
      <rect x="222" y="4" width="100" height="24" rx="4" fill="#1e293b" opacity="0.6" />
      <text x="230" y="19" font-size="12" dominant-baseline="middle">📁</text>
      <text x="248" y="18" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" dominant-baseline="middle">
        Explorateur
      </text>

      <!-- System Tray (Clock & Status) -->
      <text x="444" y="18" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#94a3b8" text-anchor="end" dominant-baseline="middle">
        10:30
      </text>
      <text x="406" y="19" font-size="12" dominant-baseline="middle">🔊</text>
    </g>
  </g>

  <!-- Title Badge Overlay at bottom-left -->
  <g transform="translate(30, 310)">
    <rect x="0" y="0" width="230" height="36" rx="8" fill="#0f172a" stroke="#6366f1" stroke-width="1.5" opacity="0.95" />
    <text x="12" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" dominant-baseline="middle">
      🖥️ Desktop Explorer
    </text>
    <text x="156" y="21" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#38bdf8" dominant-baseline="middle">
      Informatique
    </text>
  </g>
</svg>
