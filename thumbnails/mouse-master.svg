<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="mmBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140a25" />
      <stop offset="50%" stop-color="#1e103a" />
      <stop offset="100%" stop-color="#0a0515" />
    </linearGradient>

    <!-- Target Gradient -->
    <radialGradient id="targetGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#a855f7" stop-opacity="0.6" />
      <stop offset="80%" stop-color="#6366f1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Cursor Glow Filter -->
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#mmBgGrad)" />

  <!-- Radar / Circular Grid Rings -->
  <g stroke="#3b1f63" stroke-width="1" fill="none" opacity="0.6">
    <circle cx="320" cy="180" r="60" />
    <circle cx="320" cy="180" r="110" />
    <circle cx="320" cy="180" r="160" stroke-dasharray="6,4" />
    <line x1="140" y1="180" x2="500" y2="180" stroke-dasharray="4,4" />
    <line x1="320" y1="40" x2="320" y2="320" stroke-dasharray="4,4" />
  </g>

  <!-- Background Target Glow -->
  <circle cx="320" cy="180" r="100" fill="url(#targetGrad)" />

  <!-- Concentric Target Circles -->
  <circle cx="320" cy="180" r="70" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.7" />
  <circle cx="320" cy="180" r="45" fill="none" stroke="#ec4899" stroke-width="2.5" />
  <circle cx="320" cy="180" r="20" fill="#ec4899" fill-opacity="0.3" stroke="#f43f5e" stroke-width="2" />
  <circle cx="320" cy="180" r="6" fill="#f43f5e" filter="url(#purpleGlow)" />

  <!-- Secondary Targets (Floating Practice Nodes) -->
  <!-- Target Top-Left -->
  <g transform="translate(140, 110)">
    <circle cx="0" cy="0" r="24" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.6" stroke-dasharray="4,3" />
    <circle cx="0" cy="0" r="10" fill="#06b6d4" fill-opacity="0.4" />
    <circle cx="0" cy="0" r="4" fill="#67e8f9" />
  </g>

  <!-- Target Bottom-Right -->
  <g transform="translate(480, 240)">
    <circle cx="0" cy="0" r="28" fill="none" stroke="#10b981" stroke-width="2" opacity="0.6" stroke-dasharray="5,3" />
    <circle cx="0" cy="0" r="12" fill="#10b981" fill-opacity="0.4" />
    <circle cx="0" cy="0" r="5" fill="#34d399" />
  </g>

  <!-- Target Top-Right -->
  <g transform="translate(490, 100)">
    <circle cx="0" cy="0" r="18" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.7" />
    <circle cx="0" cy="0" r="6" fill="#fbbf24" />
  </g>

  <!-- Motion Trail from Left to Center -->
  <path d="M 140 110 Q 220 220, 310 185" fill="none" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" stroke-dasharray="6,4" opacity="0.8" />

  <!-- Gaming Precision Cursor (Pointing at Center Bullseye) -->
  <g transform="translate(305, 175)" filter="url(#purpleGlow)">
    <polygon points="0,0 24,9 15,16 22,28 17,31 10,19 3,24" fill="#f8fafc" stroke="#ec4899" stroke-width="2" stroke-linejoin="round" />
  </g>

  <!-- Accuracy Metric HUD Pill -->
  <g transform="translate(230, 265)">
    <rect width="180" height="32" rx="16" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.5" />
    <circle cx="20" cy="16" r="6" fill="#10b981" />
    <text x="34" y="21" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0">
      ACCURACY <tspan fill="#34d399">98.5%</tspan>
    </text>
  </g>

  <!-- Top Title -->
  <text x="320" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="900" fill="#f8fafc" letter-spacing="3" text-anchor="middle">
    MOUSE MASTER
  </text>
  <text x="320" y="70" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f472b6" letter-spacing="4" text-anchor="middle">
    CURSOR PRECISION &amp; SPEED
  </text>

  <!-- Category Badge at bottom -->
  <g transform="translate(260, 316)">
    <rect width="120" height="24" rx="12" fill="#701a75" opacity="0.4" stroke="#c026d3" stroke-width="1" />
    <text x="60" y="16" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f472b6" text-anchor="middle" letter-spacing="1">
      DEXTERITY
    </text>
  </g>
</svg>